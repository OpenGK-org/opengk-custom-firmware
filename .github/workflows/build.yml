# Build the firmware image + A2L on every push / pull request; on a version tag
# (v1.0.0, v0.3-test, ...) also publish them as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install openc166
        run: pip install -r requirements.txt

      - name: Build image + A2L
        run: make

      - name: Verify checksums
        run: python3 tools/checksum.py build/out/opengk01.bin

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="$(git rev-parse --short HEAD)"; fi
          mkdir dist
          cp build/out/opengk01.bin "dist/opengk01-$v.bin"
          cp build/out/opengk01_8mbit.bin "dist/opengk01-${v}_8mbit.bin"
          cp build/out/opengk01_8mbit.hex "dist/opengk01-${v}_8mbit.hex"
          cp build/out/opengk01.a2l "dist/opengk01-$v.a2l"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: opengk01-firmware
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opengk01-firmware
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OPENGK01 $GITHUB_REF_NAME" \
            --generate-notes
