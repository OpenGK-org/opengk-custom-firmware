# Build pull requests and publish releases for main/test pushes and version tags.
name: build

on:
  push:
    branches:
      - main
      - 'test-*[0-9][0-9]-u[0-9]*'
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install openc166 + MinGW-w64
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Build image + A2L
        run: make

      - name: Build seed & key DLLs
        run: make seedkey

      - name: Verify checksums
        run: python3 tools/checksum.py build/out/opengk01.bin

      - name: No numeric references into movable code
        run: make reloc

      - name: Validate A2L (a2ltool, pinned + hash-checked)
        run: |
          tools/fetch_a2ltool.sh
          python3 tools/check_a2l.py build/out/opengk01.a2l

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="$(git rev-parse --short HEAD)"; fi
          mkdir dist
          cp build/out/opengk01.bin "dist/opengk01-$v.bin"
          cp build/out/opengk01_8mbit.bin "dist/opengk01-${v}_8mbit.bin"
          cp build/out/opengk01_8mbit.hex "dist/opengk01-${v}_8mbit.hex"
          cp build/out/opengk01.a2l "dist/opengk01-$v.a2l"
          cp build/out/opengk_seedkey.dll build/out/opengk_seedkey_x86.dll dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: opengk01-firmware
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: firmware-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: opengk01-firmware
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            latest=$(git tag --list --sort=-version:refname | grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v${major}.${minor}.$((10#$patch + 1))"
          fi
          for file in dist/opengk01-*; do
            suffix=".${file##*.}"
            if [[ "$file" == *_8mbit.* ]]; then suffix="_8mbit$suffix"; fi
            destination="dist/opengk01-${tag}${suffix}"
            if [[ "$file" != "$destination" ]]; then mv "$file" "$destination"; fi
          done
          (cd dist && sha256sum -- opengk01-* opengk_seedkey*.dll > SHA256SUMS)
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OPENGK01 $tag" \
            --generate-notes
