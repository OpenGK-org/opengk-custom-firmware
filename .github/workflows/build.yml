# Build pull requests and publish releases for main/test pushes and version tags.
name: build

on:
  push:
    branches:
      - main
      - 'test-*[0-9][0-9]-u[0-9]*'
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install openc166
        run: pip install -r requirements.txt

      - name: Build image + A2L
        run: make

      - name: Verify checksums
        run: python3 tools/checksum.py build/out/opengk01.bin

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="$(git rev-parse --short HEAD)"; fi
          mkdir dist
          cp build/out/opengk01.bin "dist/opengk01-$v.bin"
          cp build/out/opengk01_8mbit.bin "dist/opengk01-${v}_8mbit.bin"
          cp build/out/opengk01_8mbit.hex "dist/opengk01-${v}_8mbit.hex"
          cp build/out/opengk01.a2l "dist/opengk01-$v.a2l"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: opengk01-firmware
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: firmware-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: opengk01-firmware
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            latest=$(git tag --list --sort=-version:refname | grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v${major}.${minor}.$((10#$patch + 1))"
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OPENGK01 $tag" \
            --generate-notes
